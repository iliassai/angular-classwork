<h1>{{ title }}</h1>
<button (click)="rename()">Renomer</button>
<button [disabled]="!canDelete" (click)="delete()">Supprimer</button>
<button (click)="add()">Ajouter</button>

@if (tasks.length === 0) {
  <p class="empty">Aucune tache pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks; track task.id) {
      <li>
        <p>{{ task.title | uppercase }}</p>

        <p>{{ task.dueDate | date: 'dd/MM/yyyy' }}</p>
      </li>
    }
  </ul>
}
