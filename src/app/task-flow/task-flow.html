<div class="p-4">
  <h1 class="text-xl font-bold mb-2">{{ title }}</h1>

  <div class="flex gap-2 mb-2">
    <button class="border px-2 py-1" (click)="rename()">Renommer</button>
    <button
      class="border px-2 py-1 disabled:opacity-40"
      [disabled]="!canDelete()"
      (click)="delete()"
    >
      Supprimer
    </button>
    <button class="border px-2 py-1" (click)="add()">Ajouter</button>
  </div>

  <p class="mb-2">Nombre de taches : {{ count() }}</p>

  @if (count() === 0) {
    <p>Aucune tache pour l'instant</p>
  } @else {
    <ul class="list-disc pl-5">
      @for (task of tasks(); track task.id) {
        <li>{{ task.title | uppercase }} ({{ task.dueDate | date: 'dd/MM/yyyy' }})</li>
      }
    </ul>
  }
</div>
